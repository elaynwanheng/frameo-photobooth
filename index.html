<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="frameo.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<title>frameo. PHOTO BOOTH</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100%;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
body{min-height:100dvh}
.app{width:100%;height:100dvh;min-height:100%;display:flex;align-items:center;justify-content:center}
.screen{width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 22px env(safe-area-inset-bottom)}
#cameraScreen{display:flex}
.logo{width:min(180px,42vw);height:auto;object-fit:contain;margin-bottom:clamp(18px,3vh,30px)}
.camera-wrap{width:min(82vw,600px);height:min(62dvh,700px);position:relative;background:#eee;overflow:hidden}
video{width:100%;height:100%;display:block;object-fit:cover;transform:none}
.countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.28);color:#fff;font-size:clamp(70px,18vw,150px);font-weight:700}
button{font:inherit;border:0;background:#111;color:#fff;border-radius:999px;font-weight:700;letter-spacing:.08em;cursor:pointer}
#take{margin-top:24px;padding:17px 42px;font-size:18px}
button:disabled{opacity:.5}
.receipt-screen{justify-content:flex-start;overflow:auto;padding-top:18px}
.receipt{width:105mm;min-height:148mm;background:#fff;display:flex;flex-direction:column;align-items:center;padding:7mm 7mm 6mm}
.timestamp{font-family:monospace;font-size:11px;margin-bottom:4mm}
.receipt-photo{width:91mm;height:113mm;object-fit:cover;filter:grayscale(1) contrast(1.55)}
.receipt-logo{width:48mm;height:auto;margin-top:4mm}
.actions{display:flex;gap:12px;margin-top:16px}
.actions button{font-size:14px;padding:13px 24px}
#lockHotspot{position:fixed;right:4px;bottom:4px;width:24px;height:24px;opacity:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.panel{background:#fff;border-radius:18px;padding:24px;width:min(330px,90vw);text-align:center}
.panel input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;margin:14px 0;font-size:18px;text-align:center}
.panel small{display:block;color:#777;margin-top:10px}
@media (display-mode: standalone){html,body{height:100dvh}}
@media print{
 html,body{background:#fff;overflow:visible}
 body>*:not(.app){display:none!important}
 #cameraScreen,.actions{display:none!important}
 #receiptScreen{display:flex!important;position:static;width:auto;height:auto;padding:0}
 .receipt{box-shadow:none;width:105mm;min-height:148mm;padding:7mm 7mm 6mm}
}
</style>
</head>
<body>
<div class="app">
<section class="screen" id="cameraScreen">
  <img class="logo" src="frameo-logo.png" alt="frameo.">
  <div class="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="countdown" id="countdown"></div>
  </div>
  <button id="take">TAKE PHOTO</button>
</section>

<section class="screen receipt-screen" id="receiptScreen">
  <div class="receipt">
    <div class="timestamp" id="timestamp"></div>
    <img id="photo" class="receipt-photo" alt="Photo">
    <img class="receipt-logo" src="frameo-logo.png" alt="frameo.">
  </div>
  <div class="actions">
    <button id="retake">RETAKE</button>
    <button id="print">PRINT</button>
  </div>
</section>
</div>

<div id="lockHotspot" aria-hidden="true"></div>
<div class="modal" id="lockModal">
  <div class="panel">
    <strong>FRAMEO SETTINGS</strong>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN">
    <button id="unlock" style="padding:13px 24px">UNLOCK</button>
    <small id="pinMsg"></small>
  </div>
</div>

<script>
const video=document.getElementById("video");
const take=document.getElementById("take");
const cameraScreen=document.getElementById("cameraScreen");
const receiptScreen=document.getElementById("receiptScreen");
const countdown=document.getElementById("countdown");
const photo=document.getElementById("photo");
const timestamp=document.getElementById("timestamp");
const retake=document.getElementById("retake");
const printBtn=document.getElementById("print");
const lockHotspot=document.getElementById("lockHotspot");
const lockModal=document.getElementById("lockModal");
const pin=document.getElementById("pin");
const unlock=document.getElementById("unlock");
const pinMsg=document.getElementById("pinMsg");
let stream=null,taps=0,tapTimer=null;

async function startFrontCamera(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    // Explicitly request the user-facing camera. No "ideal" fallback.
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user",width:{ideal:1280},height:{ideal:1600}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
  }catch(e){
    alert("Please allow camera access for Frameo Photo Booth.");
  }
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function doCountdown(){
  countdown.style.display="flex";
  for(const n of [3,2,1]){
    countdown.textContent=n;
    await wait(700);
  }
  countdown.style.display="none";
}
function nowString(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
async function capture(){
  take.disabled=true;
  await doCountdown();
  const canvas=document.createElement("canvas");
  const w=video.videoWidth,h=video.videoHeight,target=4/5;
  let sw=w,sh=Math.round(w/target);
  if(sh>h){sh=h;sw=Math.round(h*target)}
  const sx=Math.round((w-sw)/2),sy=Math.round((h-sh)/2);
  canvas.width=sw;canvas.height=sh;
  const ctx=canvas.getContext("2d");
  // Mirror the captured selfie so it matches the live front-camera preview.
  ctx.translate(sw,0);ctx.scale(-1,1);
  ctx.drawImage(video,sx,sy,sw,sh,0,0,sw,sh);
  photo.src=canvas.toDataURL("image/jpeg",.92);
  timestamp.textContent=nowString();
  cameraScreen.style.display="none";
  receiptScreen.style.display="flex";
  take.disabled=false;
}
take.addEventListener("click",capture);
retake.addEventListener("click",async()=>{
  receiptScreen.style.display="none";
  cameraScreen.style.display="flex";
  await startFrontCamera();
});
printBtn.addEventListener("click",()=>window.print());

// Hidden lock: tap the invisible bottom-right area 5 times quickly.
lockHotspot.addEventListener("click",()=>{
  taps++;clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>taps=0,1200);
  if(taps>=5){
    taps=0;pin.value="";pinMsg.textContent="";
    lockModal.style.display="flex";setTimeout(()=>pin.focus(),100);
  }
});
unlock.addEventListener("click",()=>{
  // Temporary development PIN. Change before public use.
  if(pin.value==="2026"){lockModal.style.display="none";alert("Settings unlocked.");}
  else pinMsg.textContent="Incorrect PIN";
});
lockModal.addEventListener("click",e=>{if(e.target===lockModal)lockModal.style.display="none"});

startFrontCamera();
</script>
</body>
</html>
