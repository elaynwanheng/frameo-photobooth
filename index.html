<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FRAMEO PHOTOBOOTH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#151515}
.logo{font-weight:800;letter-spacing:3px;font-size:20px}.paper{display:flex;gap:8px}.paper button,.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer}.paper button{background:#333;color:#aaa}.paper button.active{background:#fff;color:#111}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:20px}.camera-wrap{position:relative;width:min(88vw,1000px);height:min(70vh,650px);background:#222;border-radius:28px;overflow:hidden;box-shadow:0 18px 60px #0008}
video,canvas{width:100%;height:100%;object-fit:cover;display:block}.mirror{transform:scaleX(-1)}#canvas{display:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.count{font-size:clamp(90px,18vw,220px);font-weight:900;text-shadow:0 8px 30px #000;display:none}
.controls{height:105px;display:flex;align-items:center;justify-content:center;gap:16px;background:#151515}.btn{font-size:18px;min-width:150px}.start{background:#fff;color:#111}.secondary{background:#333;color:#fff}.danger{background:#a33;color:#fff}.hidden{display:none!important}
.preview{position:absolute;inset:0;background:#111;display:flex;align-items:center;justify-content:center;padding:25px}.receipt{height:min(72vh,650px);width:auto;max-width:75vw;background:#fff;display:flex;align-items:center;justify-content:center;padding:4%;color:#111;overflow:hidden}.receipt img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}
.message{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);background:#000b;padding:10px 16px;border-radius:12px;font-size:14px}
@media(max-width:700px){.top{padding:0 14px;height:60px}.logo{font-size:15px}.camera-wrap{width:96vw;height:65vh;border-radius:18px}.controls{height:95px}.btn{min-width:120px;padding:12px}.paper button{padding:9px 11px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">FRAMEO PHOTOBOOTH</div>
    <div class="paper"><button id="p58" class="active">58mm</button><button id="p80">80mm</button></div>
  </header>
  <main class="stage">
    <div class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="overlay"><div class="count" id="count"></div></div>
      <div class="preview hidden" id="preview">
        <div class="receipt"><img id="photo" alt="Captured photo"></div>
      </div>
      <div class="message" id="message">Camera preview</div>
    </div>
  </main>
  <footer class="controls">
    <button class="btn start" id="start">START</button>
    <button class="btn secondary hidden" id="retake">RETAKE</button>
    <button class="btn start hidden" id="print">PRINT</button>
  </footer>
</div>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),photo=document.getElementById('photo');
const count=document.getElementById('count'),preview=document.getElementById('preview'),start=document.getElementById('start');
const retake=document.getElementById('retake'),print=document.getElementById('print'),msg=document.getElementById('message');
let stream=null,paper=58;

function say(t){msg.textContent=t}
async function initCamera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1920},height:{ideal:1080}},audio:false});
  video.srcObject=stream; say("Ready");
 }catch(e){say("Camera permission is required");}
}
function countdown(){
 return new Promise(resolve=>{
  let n=3; count.textContent=n; count.style.display="block";
  const timer=setInterval(()=>{n--; if(n>0) count.textContent=n; else {clearInterval(timer);count.style.display="none";resolve()}},1000);
 });
}
async function capture(){
 if(!stream) await initCamera();
 await countdown();
 const w=video.videoWidth||1280,h=video.videoHeight||720;
 canvas.width=w;canvas.height=h;
 const ctx=canvas.getContext("2d");
 ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,w,h);ctx.restore();
 const data=canvas.toDataURL("image/jpeg",0.92); photo.src=data;
 preview.classList.remove("hidden"); start.classList.add("hidden"); retake.classList.remove("hidden"); print.classList.remove("hidden"); say("Preview");
}
start.onclick=capture; retake.onclick=capture;
print.onclick=()=>{
 const win=window.open("","_blank");
 if(!win){say("Allow pop-ups to print");return}
 win.document.write(`<html><head><title>FRAMEO PRINT</title><style>@page{size:${paper}mm auto;margin:0}body{margin:0;width:${paper}mm}img{width:${paper}mm;height:auto;display:block}</style></head><body><img src="${photo.src}"></body></html>`);
 win.document.close(); win.focus(); setTimeout(()=>win.print(),400);
};
document.getElementById("p58").onclick=()=>{paper=58;document.getElementById("p58").classList.add("active");document.getElementById("p80").classList.remove("active")};
document.getElementById("p80").onclick=()=>{paper=80;document.getElementById("p80").classList.add("active");document.getElementById("p58").classList.remove("active")};
initCamera();
</script>
</body>
</html>
